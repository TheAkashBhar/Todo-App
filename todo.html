<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="todo.css">
    <title>Todo App</title>
</head>

<body>


    <h1 class="heading">TODO APP</h1>

    <div class="todo">
        <div class="task-input">
            <input type="text" class="task-writer" placeholder="Add Task">
            <button class="addBtn btn">Add</button>
        </div>

        <div class="list">
            <ul class="task-list">
                <li class="task">Hello</li>
                <li class="task">Hiii</li>
            </ul>
        </div>

        <button class="deleteBtn btn">Delete</button>
    </div>
    <script src="todo.js"></script>
</body>

</html>
